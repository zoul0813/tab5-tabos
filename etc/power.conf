# TabOS display power savings. Edit T:/etc/power.conf, then reboot.
version=1

[display]
# Seconds since last physical activity, not delays between stages.
dim_seconds=60
backlight_off_seconds=180
# Panel-off requires keyboard restoration; touch restores only before this stage.
panel_off_seconds=300
# Brightness percentages. Dimming never raises normal brightness.
normal_brightness=75
dim_brightness=20
