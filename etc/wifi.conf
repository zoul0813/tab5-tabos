# TabOS Wi-Fi configuration template. No network is configured by this file.
# Copy to T:/etc/wifi.conf (etc/wifi.conf on the Tab5 microSD card).
# Host simulator: T/etc/wifi.conf below the configured host root.
# Uncomment version, [wifi], and the settings you need; replace example values.
# Reboot for auto-connect, or run `netctl connect` to load the saved profile.
# Credentials are stored as plaintext. Keep real passwords out of the repository.
# See docs/networking.md for configuration and network commands.

# Required format version; keep this before any section.
# version=1

# [wifi]
# Required network name: quoted, nonempty, at most 32 bytes.
# ssid="network name"

# Quoted password, at most 64 bytes. Empty string selects an open network.
# Escape a literal double quote as \" and a backslash as \\.
# password="your password"

# Optional DHCP hostname; defaults to "TabOS".
# 1-32 ASCII letters, digits, or hyphens; no leading or trailing hyphen.
# name="TabOS"

# Optional boot connection policy; defaults to true (at most three attempts).
# Set false to connect manually with `netctl connect`.
# auto_connect=true
